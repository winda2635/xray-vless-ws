name: Deploy to Cloudflare Workers (Docker)

on:
  push:
    branches:
      - main  # أو اسم الفرع الرئيسي لمستودعك (master مثلاً)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via Wrangler Action
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # هذا الأمر يخبر Wrangler ببناء الحاوية عبر Dockerfile المرفق ونشرها
          command: deploy --experimental-containers
